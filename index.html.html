<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HSK Ascent</title>
<style>
:root{--bg:#0e1117;--card:#161b24;--card2:#1e2531;--accent:#5eead4;--accent2:#a78bfa;--text:#e6e9ef;--sub:#8b93a3;--good:#4ade80;--bad:#f87171;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;}
.wrap{max-width:480px;margin:0 auto;padding:20px 16px 60px;}
h1{font-size:1.4rem;margin:0 0 4px;}
.sub{color:var(--sub);font-size:.85rem;margin-bottom:20px;}
.card{background:var(--card);border-radius:16px;padding:18px;margin-bottom:14px;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.badge{background:var(--card2);border-radius:999px;padding:6px 12px;font-size:.8rem;display:flex;gap:6px;align-items:center;}
.xpbar{height:8px;background:var(--card2);border-radius:999px;overflow:hidden;margin:8px 0;}
.xpfill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s;}
button{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#0e1117;border:none;border-radius:10px;padding:12px 18px;font-weight:700;font-size:.95rem;cursor:pointer;width:100%;}
button.ghost{background:transparent;border:1px solid var(--card2);color:var(--text);}
button:disabled{opacity:.4;}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--card2);background:var(--card2);color:var(--text);font-size:1rem;margin-bottom:10px;}
.lesson-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--card2);}
.lesson-row:last-child{border-bottom:none;}
.hanzi-big{font-size:3.5rem;text-align:center;margin:10px 0;}
.pinyin{text-align:center;color:var(--accent);font-size:1.2rem;margin-bottom:4px;}
.eng{text-align:center;color:var(--sub);margin-bottom:16px;}
.opt{display:block;width:100%;text-align:left;background:var(--card2);color:var(--text);border:1px solid transparent;margin-bottom:8px;font-weight:400;}
.opt.correct{border-color:var(--good);background:#14352a;}
.opt.wrong{border-color:var(--bad);background:#3a1f1f;}
#writer-target{margin:0 auto;}
.hidden{display:none;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card2);padding:10px 18px;border-radius:10px;font-size:.85rem;}
.small{font-size:.75rem;color:var(--sub);}
a{color:var(--accent);}
#app > *{animation:fadeSlideIn .35s ease both;}
@keyframes fadeSlideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
button{transition:transform .12s ease, filter .12s ease;}
button:active:not(:disabled){transform:scale(.96);filter:brightness(.95);}
.opt:active:not(:disabled){transform:scale(.98);}
h1{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block;}
.hanzi-big{text-shadow:0 0 30px rgba(94,234,212,.25);animation:pop .4s cubic-bezier(.34,1.56,.64,1);}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.badge{transition:transform .2s;}
.streak-fire{display:inline-block;animation:flicker 1.4s ease-in-out infinite;}
@keyframes flicker{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.15) rotate(2deg)}}
.mini-progress{display:flex;gap:4px;margin-bottom:14px;}
.mini-progress div{flex:1;height:5px;border-radius:999px;background:var(--card2);}
.mini-progress div.on{background:linear-gradient(90deg,var(--accent),var(--accent2));}
.unit-icon{font-size:1.3rem;margin-right:8px;}
.confetti{position:fixed;top:-20px;font-size:1.4rem;pointer-events:none;z-index:999;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.3}}
.levelup{position:fixed;inset:0;background:rgba(14,17,23,.85);display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:1000;animation:fadeSlideIn .3s ease both;}
.levelup h2{font-size:2rem;margin:0;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;}
.card{transition:transform .15s ease;}
.lesson-row{transition:opacity .15s;}
.path{position:relative;padding:6px 0 10px;}
.path-line{position:absolute;left:50%;top:10px;bottom:10px;width:4px;background:var(--card2);transform:translateX(-50%);z-index:0;border-radius:4px;}
.node{position:relative;display:flex;align-items:center;gap:12px;margin-bottom:26px;z-index:1;width:64%;}
.node.left{margin-right:auto;}
.node.right{margin-left:auto;flex-direction:row-reverse;text-align:right;}
.node-circle{flex-shrink:0;width:58px;height:58px;border-radius:50%;font-size:1.5rem;border:4px solid var(--bg);background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.45);cursor:pointer;color:#0e1117;}
.node-circle.done{background:linear-gradient(135deg,#4ade80,#22c55e);}
.node-circle:active{transform:scale(.92);}
.node-label{font-size:.78rem;line-height:1.3;}
.node-label b{display:block;color:var(--text);}
.unit-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.unit-tile{border-radius:18px;padding:16px 14px;cursor:pointer;min-height:108px;display:flex;flex-direction:column;justify-content:space-between;color:#0e1117;box-shadow:0 6px 16px rgba(0,0,0,.35);}
.unit-tile .uicon{font-size:1.9rem;}
.unit-tile .uname{font-size:.85rem;font-weight:700;margin-top:8px;line-height:1.2;}
.unit-tile .uprog{font-size:.7rem;opacity:.7;font-weight:600;margin-top:2px;}
.unit-tile.done{outline:3px solid #fff;outline-offset:-3px;}
.unit-tile:active{transform:scale(.95);}
.wrap{padding-bottom:90px;}
.stickyhead{position:sticky;top:0;background:var(--bg);z-index:40;padding-top:14px;margin:0 -16px;padding-left:16px;padding-right:16px;padding-bottom:8px;}
.section-label{text-transform:uppercase;letter-spacing:.08em;font-size:.7rem;color:var(--sub);margin:4px 0 10px;font-weight:700;}
.hero{border-radius:20px;padding:20px;margin-bottom:16px;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#0e1117;position:relative;overflow:hidden;}
.hero .htag{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;opacity:.75;font-weight:700;}
.hero .hname{font-size:1.3rem;font-weight:800;margin:4px 0 10px;}
.hero button{background:#0e1117;color:var(--accent);width:auto;padding:10px 18px;}
.ring{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;}
.ring span{position:relative;z-index:1;}
.ring::before{content:'';position:absolute;inset:4px;border-radius:50%;background:rgba(14,17,23,.82);}
.unit-tile{flex-direction:row;align-items:center;gap:10px;min-height:auto;padding:12px;}
.unit-tile .utext{display:flex;flex-direction:column;}
.tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--card2);display:flex;justify-content:space-around;padding:10px 0 max(10px,env(safe-area-inset-bottom));z-index:50;}
.tab{background:none!important;border:none;color:var(--sub);font-size:.68rem;display:flex;flex-direction:column;align-items:center;gap:3px;width:auto;padding:2px 16px;font-weight:600;}
.tab.active{color:var(--accent);}
.tab .ticon{font-size:1.2rem;}
.stat-big{font-size:2.2rem;font-weight:800;}
.mascot{font-size:2.2rem;display:inline-block;animation:bounce 2.2s ease-in-out infinite;}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-6px) rotate(4deg)}}
.mascot-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.mascot-bubble{background:var(--card2);border-radius:14px;padding:8px 12px;font-size:.78rem;position:relative;}
.level-head{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border-radius:14px;padding:13px 14px;margin:8px 0 10px;cursor:pointer;font-weight:700;}
.level-head .lh-right{display:flex;align-items:center;gap:10px;}
.part-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--card2);}
.part-row:last-child{border-bottom:none;}
.part-row.current{background:rgba(94,234,212,.07);margin:0 -10px;padding:12px 10px;border-radius:12px;}
.part-title{font-weight:700;}
.part-prev{font-size:1.15rem;margin:3px 0;letter-spacing:.08em;}
.part-btn{width:auto;padding:8px 14px;font-size:.8rem;flex-shrink:0;}
.lock-note{text-align:center;color:var(--sub);font-size:.8rem;margin:6px 0 16px;}
</style>
</head>

/* ===== FIREBASE CONFIG =====
Create a free project at console.firebase.google.com, enable
Email/Password auth + Firestore, then paste your config below.
Leaving this as-is runs the app in local-only mode (no cross-device sync). */
const FIREBASE_CONFIG = null; // e.g. { apiKey:"...", authDomain:"...", projectId:"...", ... }

let auth=null, db=null, uid=null;

function loadScript(src){
  return new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src=src; s.onload=()=>resolve(); s.onerror=()=>reject(new Error('Failed to load '+src));
    document.head.appendChild(s);
  });
}

async function ensureFirebase(){
  if(!FIREBASE_CONFIG) return false;
  if(window.firebase && auth) return true;
  try{
    await loadScript('https://cdn.jsdelivr.net/npm/firebase@10.7.1/firebase-app-compat.js');
    await loadScript('https://cdn.jsdelivr.net/npm/firebase@10.7.1/firebase-auth-compat.js');
    await loadScript('https://cdn.jsdelivr.net/npm/firebase@10.7.1/firebase-firestore-compat.js');
    firebase.initializeApp(FIREBASE_CONFIG);
    auth = firebase.auth();
    db = firebase.firestore();
    return true;
  }catch(e){ console.warn('Firebase failed to load', e); return false; }
}

/* ===== STATE ===== */
let state = {xp:0, level:1, streak:0, lastDate:null, learned:{}, mistakes:{}, soundOn:true};

function loadLocal(){ try{ const s=localStorage.getItem('hskAscentState'); if(s) state=JSON.parse(s); }catch(e){ console.warn('localStorage unavailable, using in-memory state'); } }
function saveLocal(){ try{ localStorage.setItem('hskAscentState', JSON.stringify(state)); }catch(e){} }
async function saveCloud(){ if(db&&uid) await db.collection('users').doc(uid).set(state); }
async function loadCloud(){ if(db&&uid){ const d=await db.collection('users').doc(uid).get(); if(d.exists) state=d.data(); } }
async function persist(){ saveLocal(); await saveCloud(); }

function xpForNextLevel(lvl){ return lvl*100; }
let justLeveledUp = false;
function addXP(n){
  state.xp += n;
  while(state.xp >= xpForNextLevel(state.level)){ state.xp -= xpForNextLevel(state.level); state.level++; justLeveledUp=true; }
  const today = new Date().toDateString();
  if(state.lastDate !== today){
    const y = new Date(Date.now()-86400000).toDateString();
    state.streak = (state.lastDate===y) ? state.streak+1 : 1;
    state.lastDate = today;
  }
}

let audioCtx=null;
function beep(freq,dur,type){
  if(!state.soundOn) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type||'sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(.15, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime+dur/1000);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+dur/1000);
  }catch(e){}
}
function soundCorrect(){ beep(880,150); setTimeout(()=>beep(1160,180),90); }
function soundWrong(){ beep(180,220,'sawtooth'); }

function confettiBurst(){
  const emojis=['🎉','✨','⭐','🎊','🔥'];
  for(let i=0;i<24;i++){
    const el=document.createElement('div');
    el.className='confetti';
    el.textContent=emojis[Math.floor(Math.random()*emojis.length)];
    el.style.left=Math.random()*100+'vw';
    el.style.animationDuration=(1.5+Math.random()*1.5)+'s';
    el.style.fontSize=(1+Math.random())+'rem';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 3200);
  }
}

function showLevelUp(level){
  const el=document.createElement('div');
  el.className='levelup';
  el.innerHTML = `<div style="font-size:3rem">🏆</div><h2>Level ${level}!</h2><p class="small">Keep going — 加油!</p>`;
  document.body.appendChild(el);
  confettiBurst();
  beep(660,120); setTimeout(()=>beep(880,120),120); setTimeout(()=>beep(1100,220),240);
  setTimeout(()=>el.remove(), 1800);
}

function speak(text){

/* ===== SERIES + UNLOCK LOGIC ===== */
function unitLevel(i){ const m=UNITS[i].name.match(/^HSK(\d)/); return m?parseInt(m[1],10):(i<15?1:2); }
function seriesName(name){
  const lvl=name.match(/^HSK(\d)/);
  const base=name.replace(/^HSK\d\s+/,'').replace(/\s+[IVXLC]+$/,'');
  if(lvl){
    if(/^(Conjunctions|Prepositions|Measure Words|Phrases|Interjections|Connectors|Numbers & Particles)/.test(base)) return 'Connectors & Grammar';
    if(lvl[1]==='3' && /^(Around Town|Objects & Tech|Nature & Places|Life & Places|More Nouns)/.test(base)) return 'Nouns';
  }
  return base;
}
const SERIES=[];
(function(){
  const map={};
  UNITS.forEach((u,i)=>{
    const L=unitLevel(i), nm=seriesName(u.name), key=L+'|'+nm;
    if(!map[key]){ map[key]={name:nm,level:L,units:[]}; SERIES.push(map[key]); }
    map[key].units.push(i);
  });
})();
const UNIT_SERIES={};
SERIES.forEach((sr,si)=>sr.units.forEach((ui,k)=>{ UNIT_SERIES[ui]={si:si,part:k+1,of:sr.units.length}; }));

function unitLearned(i){ return UNITS[i].words.filter(w=>state.learned[w.h]).length; }
function unitDone(i){ return unitLearned(i)===UNITS[i].words.length; }
function seriesInfo(sr){
  const cur=sr.units.findIndex(ui=>!unitDone(ui));
  const total=sr.units.reduce((a,ui)=>a+UNITS[ui].words.length,0);
  const learned=sr.units.reduce((a,ui)=>a+unitLearned(ui),0);
  return {cur:cur,total:total,learned:learned,complete:cur===-1,doneParts:cur===-1?sr.units.length:cur};
}

const TILE_COLORS=['linear-gradient(135deg,#5eead4,#22d3ee)','linear-gradient(135deg,#a78bfa,#f472b6)','linear-gradient(135deg,#fbbf24,#f97316)','linear-gradient(135deg,#34d399,#10b981)','linear-gradient(135deg,#60a5fa,#818cf8)','linear-gradient(135deg,#f87171,#fb923c)','linear-gradient(135deg,#c084fc,#818cf8)','linear-gradient(135deg,#4ade80,#22c55e)'];
let openLevels=null, lastCurLevel=null;

function toggleLevel(L){
  const body=document.getElementById('lvl'+L), chev=document.getElementById('chev'+L);
  const open=body.style.display==='none';
  body.style.display=open?'':'none';
  chev.textContent=open?'▾':'▸';
  if(open) openLevels.add(L); else openLevels.delete(L);
}

function openSeries(si){
  const sr=SERIES[si], info=seriesInfo(sr);
  const visible=info.complete?sr.units.length:info.cur+1;
  if(visible===1){ startLesson(info.complete?sr.units[0]:sr.units[info.cur]); return; }
  renderSeries(si);
}

function renderSeries(si){
  const sr=SERIES[si], info=seriesInfo(sr);
  const visible=info.complete?sr.units.length:info.cur+1;
  const rows=sr.units.slice(0,visible).map((ui,k)=>{
    const u=UNITS[ui], done=unitDone(ui), cnt=unitLearned(ui), isCur=!done && k===info.cur;
    const label=u.name.replace(/^HSK\d\s+/,'');
    const preview=u.words.slice(0,4).map(w=>w.h).join(' ');
    return `<div class="part-row ${isCur?'current':''}"><div><div class="part-title">${done?'✅ ':(isCur?'▶️ ':'')}Part ${k+1} <span class="small">· ${label}</span></div><div class="part-prev">${preview}</div><div class="small">${cnt}/${u.words.length} words</div></div><button class="part-btn" onclick="startLesson(${ui})">${done?'Review':(cnt>0?'Continue':'Start')}</button></div>`;
  }).join('');
  const locked=sr.units.length-visible;
  app.innerHTML=`
    <div class="stickyhead">
      <button class="ghost" style="width:auto;padding:6px 12px;font-size:.8rem;margin-bottom:6px" onclick="renderHome()">← Back</button>
      <h1>${sr.name}</h1>
      <div class="sub" style="margin-bottom:6px">HSK ${sr.level} · ${info.learned}/${info.total} words · ${info.doneParts}/${sr.units.length} parts done</div>
    </div>
    <div class="card">${rows}</div>
    ${locked>0?`<div class="lock-note">🔒 ${locked} more part${locked>1?'s':''} unlock as you finish each one</div>`:''}
    ${tabBar('home')}
  `;
  window.scrollTo(0,0);
}

function renderHome(){
  if(justLeveledUp){ justLeveledUp=false; showLevelUp(state.level); }
  const need=xpForNextLevel(state.level);
  const pct=Math.min(100,Math.round(state.xp/need*100));
  const totalLearned=Object.keys(state.learned).length;
  const nextIdx=UNITS.findIndex((u,i)=>!unitDone(i));
  const levels=[...new Set(SERIES.map(sr=>sr.level))];
  const curL=nextIdx===-1?levels[levels.length-1]:unitLevel(nextIdx);
  if(openLevels===null){ openLevels=new Set([curL]); }
  else if(lastCurLevel!==null && curL!==lastCurLevel){ openLevels.add(curL); }
  lastCurLevel=curL;
  let hero;
  if(nextIdx===-1){
    hero=`<div class="hero"><div class="htag">All levels complete 🎉</div><div class="hname">Every word learned!</div><button onclick="renderStats()">See your stats</button></div>`;
  } else {
    const us=UNIT_SERIES[nextIdx], sr=SERIES[us.si], u=UNITS[nextIdx];
    hero=`<div class="hero"><div class="htag">Continue · HSK ${sr.level}</div><div class="hname">${UNIT_ICONS[nextIdx]||'📖'} ${sr.name}${us.of>1?' · Part '+us.part+'/'+us.of:''}</div><div class="small" style="color:#0e1117;opacity:.8;margin-bottom:10px">${unitLearned(nextIdx)}/${u.words.length} words done</div><button onclick="startLesson(${nextIdx})">Continue →</button></div>`;
  }
  const levelHTML=levels.map(L=>{
    const list=SERIES.filter(sr=>sr.level===L);
    let tot=0,lr=0; list.forEach(sr=>{ const inf=seriesInfo(sr); tot+=inf.total; lr+=inf.learned; });
    const open=openLevels.has(L);
    return `<div class="level-head" onclick="toggleLevel(${L})"><span>HSK ${L}</span><span class="lh-right"><span class="small">${lr}/${tot} · ${Math.round(lr/tot*100)}%</span><span id="chev${L}">${open?'▾':'▸'}</span></span></div><div id="lvl${L}" style="${open?'':'display:none'}"><div class="unit-grid" id="grid${L}"></div></div>`;
  }).join('');
  app.innerHTML=`
    <div class="stickyhead">
      <h1>HSK Ascent</h1>
      <div class="sub" style="margin-bottom:10px">汉语升阶 · ${totalLearned}/${ALL_WORDS.length} words learned</div>
      <div class="card" style="margin-bottom:0">
        <div class="topbar">
          <div class="badge"><span class="streak-fire">🔥</span> ${state.streak} day streak</div>
          <div class="badge">Lv. ${state.level}</div>
        </div>
        <div class="xpbar"><div class="xpfill" style="width:${pct}%"></div></div>
        <div class="small">${state.xp} / ${need} XP to next level</div>
      </div>
    </div>
    ${hero}
    <div class="mascot-row"><span class="mascot">🐼</span><div class="mascot-bubble">${MASCOT_LINES[Math.floor(Math.random()*MASCOT_LINES.length)]}</div></div>
    ${levelHTML}
    ${tabBar('home')}
  `;
  SERIES.forEach((sr,si)=>{
    const info=seriesInfo(sr), grid=document.getElementById('grid'+sr.level);
    const pctDone=Math.round(info.learned/info.total*100);
    const icon=info.complete?'✅':(UNIT_ICONS[sr.units[info.cur]]||'📖');
    const sub=info.complete?('Done · '+info.total+' words'):(sr.units.length>1?('Part '+(info.cur+1)+' of '+sr.units.length):(info.learned+'/'+info.total+' words'));
    const tile=document.createElement('div');
    tile.className='unit-tile'+(info.complete?' done':'');
    tile.style.background=TILE_COLORS[si%TILE_COLORS.length];
    tile.innerHTML=`<div class="ring" style="background:conic-gradient(#0e1117 ${pctDone*3.6}deg, rgba(14,17,23,.3) 0deg)"><span>${icon}</span></div><div class="utext"><div class="uname">${sr.name}</div><div class="uprog">${sub}</div></div>`;
    tile.onclick=()=>openSeries(si);
    grid.appendChild(tile);
  });
}

/* ===== LESSON FLOW ===== */
let queue=[], current=null, step=0;

function startLesson(unitIndex){
  queue = UNITS[unitIndex].words;
  step=0; nextWord();
}
function startReview(){
  queue = Object.keys(state.mistakes).map(h=>ALL_WORDS.find(w=>w.h===h)).filter(Boolean);
  if(queue.length===0){ return; }
  step=0; nextWord();
}

function nextWord(){
  if(step>=queue.length){ addXP(0); persist(); renderHome(); return; }
  current = queue[step];
  renderFlashcard();
}

function renderFlashcard(){
  const dots = queue.map((_,i)=>`<div class="${i<step?'on':i===step?'on':''}"></div>`).join('');
  app.innerHTML = `
    <div class="mini-progress">${dots}</div>
    <div class="card">
      <div class="small">Word ${step+1} / ${queue.length}</div>
      <div class="hanzi-big">${current.h}</div>
      <div class="pinyin">${current.p}</div>
      <div class="eng">${current.e}</div>
      <button onclick="speak('${current.h}')">🔊 Hear it</button>
      <div style="height:8px"></div>
      <button class="ghost" onclick="renderMC()">Next: Quiz me →</button>
      <div class="small" style="text-align:center;margin-top:10px">👈 swipe to hear again · swipe to quiz 👉</div>
    </div>
  `;
  const cardEl = document.querySelector('.card');
  let touchX=null;
  cardEl.addEventListener('touchstart', e=>{ touchX=e.touches[0].clientX; });
  cardEl.addEventListener('touchend', e=>{
    if(touchX===null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    if(dx > 60) renderMC();
    else if(dx < -60) speak(current.h);
    touchX=null;
  });
}

function renderMC(){
  const wrong = ALL_WORDS.filter(w=>w.h!==current.h).sort(()=>Math.random()-.5).slice(0,3);
  const opts = [...wrong, current].sort(()=>Math.random()-.5);
  app.innerHTML = `
    <div class="card">
      <div class="small">Multiple choice</div>
      <div class="hanzi-big">${current.h}</div>
      <div class="pinyin">${current.p}</div>
      <p>What does this mean?</p>
      <div id="opts"></div>
    </div>
  `;
  const box = document.getElementById('opts');
  opts.forEach(o=>{
    const b=document.createElement('button');
    b.className='opt'; b.textContent=o.e;
    b.onclick=()=>{
      [...box.children].forEach(c=>c.disabled=true);
      if(o.h===current.h){ b.classList.add('correct'); addXP(15); soundCorrect(); }
      else { b.classList.add('wrong'); [...box.children].find(c=>c.textContent===current.e).classList.add('correct'); soundWrong(); state.mistakes[current.h]=true; }
      setTimeout(renderPinyinQuiz, 700);
    };
    box.appendChild(b);
  });
}

function renderPinyinQuiz(){
  app.innerHTML = `
    <div class="card">
      <div class="small">Type the pinyin (tone marks optional)</div>
      <div class="hanzi-big">${current.h}</div>
      <div class="eng">${current.e}</div>
      <input id="pyinput" placeholder="e.g. ni hao">
      <button onclick="checkPinyin()">Check</button>
      <div id="fb" class="small" style="margin-top:8px"></div>
    </div>
  `;
}

function stripTones(s){ return s.toLowerCase().replace(/[āáǎà]/g,'a').replace(/[ēéěè]/g,'e').replace(/[īíǐì]/g,'i').replace(/[ōóǒò]/g,'o').replace(/[ūúǔù]/g,'u').replace(/[1-5]/g,'').replace(/\s+/g,''); }

function checkPinyin(){
  const val = document.getElementById('pyinput').value;
  const ok = stripTones(val)===stripTones(current.p);
  document.getElementById('fb').textContent = ok ? '✅ Correct!' : `❌ It's "${current.p}"`;
  document.getElementById('fb').style.color = ok ? 'var(--good)' : 'var(--bad)';
  if(ok){ addXP(15); soundCorrect(); } else { soundWrong(); state.mistakes[current.h]=true; }
  setTimeout(renderWriting, 900);
}

function renderWriting(){
  const firstChar = current.h[0];
  app.innerHTML = `
    <div class="card">
      <div class="small">Watch the stroke order, then try writing it</div>
      <div class="pinyin">${current.p} — ${current.e}</div>
      <div id="writer-target" style="width:200px;height:200px;background:var(--card2);border-radius:12px;margin:10px auto;display:flex;align-items:center;justify-content:center;font-size:.8rem;color:var(--sub)">Loading…</div>
      <button id="animBtn" disabled>▶ Show stroke order</button>
      <div style="height:8px"></div>
      <button id="quizBtn" class="ghost" disabled>✍️ Quiz me on this character</button>
      <div id="fb2" class="small" style="margin-top:8px;text-align:center"></div>
    </div>
  `;
  function finishWord(){ state.learned[current.h]=true; delete state.mistakes[current.h]; step++; persist(); nextWord(); }

  if(window.HanziWriter){ setupWriter(); }
  else {
    loadScript('https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js')
      .then(setupWriter)
      .catch(()=>{
        document.getElementById('writer-target').textContent = firstChar;
        document.getElementById('writer-target').style.fontSize='3rem';
        document.getElementById('fb2').textContent = "⚠️ Stroke practice couldn't load here (works fine on GitHub Pages). Skipping ahead.";
        addXP(10);
        setTimeout(finishWord, 1800);
      });
  }

  function setupWriter(){
    document.getElementById('writer-target').textContent='';
    document.getElementById('animBtn').disabled=false;
    document.getElementById('quizBtn').disabled=false;
    const writer = HanziWriter.create('writer-target', firstChar, {
      width:200, height:200, padding:10,
      strokeColor:'#e6e9ef', radicalColor:'#5eead4',
      outlineColor:'#2a3140'
    });
    document.getElementById('animBtn').onclick=()=>writer.animateCharacter();
    document.getElementById('quizBtn').onclick=()=>{
      document.getElementById('fb2').textContent='Draw the character below...';
      writer.quiz({
        onComplete: (summary)=>{
          document.getElementById('fb2').textContent = `✅ Done! (${summary.totalMistakes} mistakes)`;
          soundCorrect();
          addXP(20);
          setTimeout(finishWord, 1200);
        }
      });
    };
  }
}

/* ===== BOOT ===== */
try{
  loadLocal();
  renderHome();
}catch(e){
  document.getElementById('app').innerHTML = `<div class="card"><p>Something went wrong on load:</p><p class="small">${e.message}</p></div>`;
}
</script>
